name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good openjdk-17-jdk unzip wget expect
          pip install --upgrade pip setuptools "cython<3.0" buildozer

      - name: Build APK with Buildozer (Auto-Accept Licenses)
        run: |
          expect -c '
          set timeout -1
          spawn buildozer -v android debug
          expect {
              "Accept? (y/N):" { send "y\r"; exp_continue }
              "Press y to accept" { send "y\r"; exp_continue }
              eof
          }
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK_IYAD_APK
          path: bin/*.apk
